# On every push to main: TypeScript and .NET tests, then the npm and NuGet packages on GitHub Packages.
# The version comes from typescript/package.json; when it is already published, a build number is added (0.1.0-build.1, …).
name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two pushes never compute the same build number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  DOTNET_VERSION: 8.0.x

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: npm ci --force
      - run: npm run typecheck
      - name: TypeScript tests
        run: npm test
      - name: .NET tests and TypeScript/.NET parity
        run: npm run test:dotnet
      - name: Version resolver tests
        run: node --test ../.github/scripts/resolve-version.test.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve the version
        id: version
        run: node .github/scripts/resolve-version.mjs

      - name: Publish the npm package
        working-directory: typescript
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_NAME: ${{ steps.version.outputs.npm-name }}
        run: |
          npm ci --force
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pkg set "name=$NPM_NAME" "repository.type=git" "repository.url=git+${{ github.server_url }}/${{ github.repository }}.git"
          echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" > "$RUNNER_TEMP/.npmrc"
          npm publish --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/.npmrc" --tag latest

      - name: Publish the NuGet package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack dotnet/src/Certifie.Web3Service -c Release -o artifacts/nuget \
            -p:Version="$VERSION" -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" -p:RepositoryType=git
          dotnet nuget push "artifacts/nuget/Certifie.Web3Service.$VERSION.nupkg" --source "$NUGET_SOURCE" --api-key "$GITHUB_TOKEN"

      - name: Summary
        run: |
          echo "Published \`${{ steps.version.outputs.npm-name }}@${{ steps.version.outputs.version }}\` (npm) and \`Certifie.Web3Service ${{ steps.version.outputs.version }}\` (NuGet) on GitHub Packages." >> "$GITHUB_STEP_SUMMARY"
